services:
  - type: web
    name: labprep-ai
    runtime: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      # Paste your Gemini key in the Render dashboard (Environment). Never commit it to GitHub.
      - key: GEMINI_API_KEY
        sync: false
      # Optional but recommended: a free Neon database so people can sign in and keep their experiments on every device.
      # Paste its connection string in the Render dashboard (Environment). Never commit it to GitHub.
      - key: DATABASE_URL
        sync: false
      # Optional: force a model. Leave unset and the site picks a working Gemini Flash model by itself.
      # - key: AI_MODEL
      #   value: gemini-flash-latest
      # Optional: require a code before anyone can use the AI
      # - key: ACCESS_CODE
      #   sync: false
