services:
  - type: web
    name: labprep-ai
    runtime: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
    # Free plan: the filesystem is wiped on every restart/redeploy/idle spin-down, so accounts and PDFs are lost.
    # For durable data (paid plans), attach a Persistent Disk mounted at /var/data and add:
    #   - key: STORAGE_DIR
    #     value: /var/data
